<header class="navbar">
  <a class="brand" routerLink="/">Backoffice</a>

  @if (auth.isAdmin()) {
    <nav>
      <a routerLink="/authors" routerLinkActive="active">Autores</a>
      <a routerLink="/books" routerLinkActive="active">Libros</a>
    </nav>
  }

  @if (auth.isLoggedIn()) {
    <nav>
      <a routerLink="/chat" routerLinkActive="active">Chat</a>
    </nav>
  }

  <div class="session">
    @if (auth.user(); as user) {
      <span class="user">{{ user.name }} ({{ user.role }})</span>
      <button type="button" class="secondary" (click)="auth.logout()">Cerrar sesión</button>
    } @else {
      <nav>
        <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
        <a routerLink="/register" routerLinkActive="active">Registrarse</a>
      </nav>
    }
  </div>
</header>
